[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "materialmaster-ai"
version = "0.1.0"
description = "Evidence-first material master quality and human review, with local AI."
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "sqlalchemy>=2.0.36,<3", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1",
  "python-multipart>=0.0.22,<1", "numpy>=2.1,<3", "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "pip-audit>=2.8,<3"]
semantic = ["sentence-transformers>=5,<6"]

[project.scripts]
materialmaster = "materialmaster.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/materialmaster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
